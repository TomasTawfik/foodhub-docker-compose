
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodhub-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: foodhub.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: foodhub-backend-service
                port:
                  number: 3000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: foodhub-frontend-service
                port:
                  number: 80
