
apiVersion: apps/v1
kind: Deployment

metadata:
  name: foodhub-database

spec:
  replicas: 1

  selector:
    matchLabels:
      app: foodhub-database

  template:
    metadata:
      labels:
        app: foodhub-database

    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: foodhub

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodhub-secrets
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: foodhub-postgres-pvc

        - name: init-sql
          hostPath:
            path: /mnt/database
            type: Directory
